name: Gated automatic release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run version only; never publishes or creates a tag'
        default: v0.2.0-rc.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Verify native SemVer and exact tagged commit (manual runs are dry only)
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          flags=(--dry-run)
          if [[ "$IS_TAG_PUSH" == true ]]; then flags=(); fi
          go run ./cmd/packaging --mode verify-tag --tag "$RELEASE_TAG" "${flags[@]}"
  gates:
    needs: version-gate
    uses: ./.github/workflows/quality.yml
  package:
    needs: gates
    uses: ./.github/workflows/packaging.yml
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      exact_tag: ${{ github.event_name == 'push' }}
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version-gate, gates, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist/release-assets
      - name: Check complete transferred asset set and tagged build manifest
        run: |
          go run ./cmd/packaging --mode verify-tag --tag "$RELEASE_TAG"
          go run ./cmd/packaging --mode verify-assets --tag "$RELEASE_TAG" --out dist/release-assets
          expected_commit=$(git rev-parse HEAD)
          jq -e --arg commit "$expected_commit" --arg tag "$RELEASE_TAG" '.dry_run == false and .commit == $commit and .tag == $tag' dist/release-assets/release-manifest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release-assets/checksums.txt
      - name: Create draft, verify every uploaded asset, then publish atomically as a set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash packaging/publish.sh dist/release-assets "$RELEASE_TAG"
